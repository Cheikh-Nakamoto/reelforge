# yaml-language-server: $schema=./style.schema.json
name: reel-dynamique
description: >-
  Reel nerveux : coupes serrées, zooms alternés à chaque coupe, sous-titres 2 mots en capitales au centre,
  jusqu'à 3 mots géants derrière le sujet, couleurs vives et SFX marqués.
fonts:
  caption: Montserrat
  captionWeight: 900
  behind: League Gothic
  behindWeight: 400
  graphic: Archivo Black
colors:
  text: "#ffffff"
  accent: "#ff2e63"
  stroke: "rgba(0,0,0,0.85)"
  behind: "#ffffff"
  panel: "rgba(0,0,0,0.78)"
rhythm:
  minPause: 0.25       # coupe presque toutes les respirations
  keep: 0.07
captions:
  look: bold          # blanc épais, contour noir, le mot prononcé passe en accent (Hormozi / Beast)
  maxWords: 2
  maxChars: 14
  animation: slam
  uppercase: true
  size: 90
  position: mid
  emphasis: 1.35
  emojis: true
behind:
  max: 3
  hold: 1.3
  minGap: 3.5
  animation: flip
  size: 0.38
  hideCaptions: true   # le mot géant remplace les sous-titres le temps de son apparition
mograph:
  minGap: 2
  triggers:
    - words: [attention, stop, erreur, piège, jamais]
      kind: callout
    - words: [gratuit, facile, rapide, simple, nouveau, secret]
      kind: badge
    - words: [premièrement, deuxièmement, troisièmement, ensuite, enfin]
      kind: list
  hook: true
motion:
  punchIn: 1.1
  jumpZoom: 1.12
  ease: expo.out
  depth: 0.8   # entrées en rotation 3D, mots derrière extrudés
  blur: true
  drift: 1.06
effects:
  maxPer10s: 3
  strongWord: both     # zoom punch + secousse sur les mots forts
  cuts: mix            # whip pan et flash blanc, en alternance
  cutEvery: 2
  colorPop: true       # le décor passe en noir et blanc sous les mots derrière, le sujet garde sa couleur
  rgbSplit: true       # décalage RVB sur chaque punch et secousse
  ladder: 2            # zooms en escalier à l'ouverture des deux plus longues prises
  keywords:
    - words: [boom, bam, stop, choc]
      kind: shake
    - words: [attention, incroyable, dingue, wow]
      kind: strobe
  intensity: 1
scenes:
  max: 3   # punchlines en typo plein écran
frame:
  device: true
look:
  grade: bright-pop
  gradeIntensity: 0.6
audio:
  musicDb: -18
  duckDb: 9
  sfxDb: -4
